<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D9898B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EE9F80;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D9898B;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#D9898B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EE9F80;stop-opacity:0.3" />
    </linearGradient>
    <clipPath id="iconClip">
      <circle cx="80" cy="80" r="62" />
    </clipPath>
  </defs>

  <!-- Icon background -->
  <circle cx="80" cy="80" r="68" fill="#FDF1F2" />

  <!-- Outer activity ring — full circle track -->
  <circle cx="80" cy="80" r="58" fill="none" stroke="#F5D4D6" stroke-width="9" />

  <!-- Activity ring arc (~270°, gap at top-left) -->
  <circle cx="80" cy="80" r="58" fill="none" stroke="url(#ringGrad)" stroke-width="9"
    stroke-dasharray="303 91"
    stroke-dashoffset="46"
    stroke-linecap="round" />

  <!-- Inner ring track -->
  <circle cx="80" cy="80" r="43" fill="none" stroke="#F5D4D6" stroke-width="7" />

  <!-- Inner ring arc (~220°) -->
  <circle cx="80" cy="80" r="43" fill="none" stroke="url(#ringGrad)" stroke-width="7"
    stroke-dasharray="165 105"
    stroke-dashoffset="26"
    stroke-linecap="round"
    opacity="0.75" />

  <!-- Cycle wave in center — a smooth sinusoidal curve representing cycle phases -->
  <path d="M 44 80
    C 51 68, 58 68, 65 80
    C 72 92, 79 92, 86 80
    C 93 68, 100 68, 107 80
    C 114 92, 121 92, 116 80"
    fill="none" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round"
    clip-path="url(#iconClip)" />

  <!-- Dot markers on wave peaks — representing cycle data points -->
  <circle cx="65" cy="80" r="3" fill="#D9898B" />
  <circle cx="86" cy="80" r="3" fill="#D9898B" />
  <circle cx="107" cy="80" r="3" fill="#EE9F80" />

  <!-- Wordmark: LunaraFit -->
  <!-- "Lunara" in dark -->
  <text x="164" y="72"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-weight="600"
    font-size="38"
    letter-spacing="-0.5"
    fill="#1F1F1F">Lunara</text>

  <!-- "Fit" in blush -->
  <text x="164" y="110"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-weight="300"
    font-size="28"
    letter-spacing="6"
    fill="#D9898B">FIT</text>

  <!-- Thin divider line between words -->
  <line x1="164" y1="118" x2="340" y2="118" stroke="#F5D4D6" stroke-width="1.5" />
</svg>
